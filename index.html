<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Télécommande de maison : une colonne sur iPhone, deux colonnes sur iPad. En-tête fixe, barre d'onglets en bas.
   Couleurs de la maison : blanc enduit, velours vert, noyer, laiton ; le soir, velours noir et laiton. Une seule police, Jost ; titres en laiton. */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --surface-2:#ede7dd; --line:#e4ddd1; --line-2:#cfc6b8;
  --ink:#16181b; --ink-2:#5e5a54; --ink-3:#7f786e;
  --brand:#2e4a36; --fill:#2e4a36; --on-fill:#f6f3ee; --accent:#a8874f; --knob:#ffffff;
  --ok:#2e4a36; --ok-bg:#e3ebe3; --warn:#6b4510; --warn-bg:#f4ddb4; --bad:#96391a; --bad-bg:#f6dccd;
  --scrim:rgba(22,24,27,.4); --shadow:0 1px 3px rgba(69,51,36,.08); --lift:0 8px 24px rgba(69,51,36,.18);
  --r:6px; --r-lg:10px; --lit:#f4d19a; --pool:#62a4f8; --pool-ink:#0b2545; --glass:#dde3da;
  --font:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1b1d22; --surface-2:#24272e; --line:#2c3037; --line-2:#3e434d;
  --ink:#f3eee6; --ink-2:#b5aea3; --ink-3:#8e877d;
  --brand:#d2ae6d; --fill:#c9a463; --on-fill:#16181b; --accent:#d2ae6d; --knob:#f3eee6;
  --ok:#9bc4a5; --ok-bg:#1f2c23; --warn:#f0b95a; --warn-bg:#362a14; --bad:#f08a5d; --bad-bg:#3a2016;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 3px rgba(0,0,0,.4); --lift:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
  --lit:#5c4321; --pool:#2f6fbf; --pool-ink:#ffffff; --glass:#2e3a33;
}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1b1d22; --surface-2:#24272e; --line:#2c3037; --line-2:#3e434d;
  --ink:#f3eee6; --ink-2:#b5aea3; --ink-3:#8e877d;
  --brand:#d2ae6d; --fill:#c9a463; --on-fill:#16181b; --accent:#d2ae6d; --knob:#f3eee6;
  --ok:#9bc4a5; --ok-bg:#1f2c23; --warn:#f0b95a; --warn-bg:#362a14; --bad:#f08a5d; --bad-bg:#3a2016;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 3px rgba(0,0,0,.4); --lift:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
  --lit:#5c4321; --pool:#2f6fbf; --pool-ink:#ffffff; --glass:#2e3a33;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:var(--r);background:var(--fill);color:var(--on-fill);display:grid;place-items:center;flex:none}
.brand-txt{min-width:0}
h1{font-family:var(--serif);font-size:24px;line-height:1.1;margin:0;color:var(--ink);font-weight:500;letter-spacing:0;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.pill.ok::before{background:var(--ok)} .pill.bad::before{background:var(--bad)}
.icon-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);color:var(--brand);display:grid;place-items:center;cursor:pointer;flex:none}
.top .icon-btn{margin-left:auto}

/* Contenu */
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px;font-weight:600}
.muted{color:var(--ink-3);font-size:14px;margin:0}
.lead{color:var(--ink-2);margin:2px 0 14px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;cursor:pointer}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sec-row .sec{margin:0}
.sec-row .linkbtn,.chips-row .linkbtn{flex:none;font-size:14px;min-height:40px;padding:0 4px;text-decoration:none}

/* Bandeau d'état */
.status{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-lg);background:var(--ok-bg)}
.status.warn{background:var(--warn-bg)} .status.bad{background:var(--bad-bg)}
.status-dot{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--bg);font-weight:700;font-size:20px}
.status.warn .status-dot{background:var(--warn)} .status.bad .status-dot{background:var(--bad)}
.status h2{font-family:var(--serif);font-weight:500;margin:2px 0 4px;font-size:21px;line-height:1.25;color:var(--ok);text-wrap:balance}
.status.warn h2{color:var(--warn)} .status.bad h2{color:var(--bad)}
.status p,.status li{margin:0;color:var(--ink-2);font-size:14px}
.status ul{margin:0;padding-left:18px;display:grid;gap:2px}
.status .sum{margin-top:6px;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.status-txt{min-width:0}

/* Tout fermer */
.allclose{margin-top:12px;width:100%;display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--bg);text-align:left;cursor:pointer}
.allclose .row-ic{background:var(--fill);color:var(--on-fill)}
.allclose b{display:block;font-weight:600;font-size:16px}
.allclose small{display:block;color:var(--ink-2);font-size:13px}
.allclose.busy{opacity:.55;pointer-events:none}
a.allclose{color:inherit;text-decoration:none}
a.btn{text-decoration:none}
.cams{margin-top:22px}
.cams .sec{margin-bottom:0}

/* Scènes */
.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scene{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:108px;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);text-align:left;cursor:pointer;transition:background .2s,border-color .2s,transform .1s;overflow-wrap:anywhere}
.scene:active{transform:scale(.98)}
.scene.now{border-color:var(--accent);border-width:2px;padding:13px}
.scene-ic{width:42px;height:42px;border-radius:50%;background:var(--fill);color:var(--on-fill);display:grid;place-items:center}
.scene-name{font-weight:600;font-size:16px;line-height:1.25}
.scene-now{position:absolute;top:12px;right:10px;font-size:12px;font-weight:600;color:var(--brand);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.scene-ok{display:none;position:absolute;top:14px;right:12px;align-items:center;gap:4px;font-size:13px;font-weight:600}
.scene-ok .i{width:16px;height:16px}
.scene.busy{opacity:.55;pointer-events:none}
.scene.done{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.scene.done .scene-ic{background:var(--on-fill);color:var(--fill)}
.scene.done .scene-ok{display:inline-flex}
.scene.done .scene-now{display:none}
.ask{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:none;color:var(--brand);font-weight:600;cursor:pointer}

/* Listes */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px}
.row+.row{border-top:1px solid var(--line)}
.row-ic{flex:none;width:40px;height:40px;border-radius:var(--r);background:var(--surface-2);color:var(--brand);display:grid;place-items:center}
.row-txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row-txt b{display:block;font-weight:600;line-height:1.3}
.row-txt small{display:block;color:var(--ink-2);font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums}
.row.is-off{opacity:.6}

/* Pièces */
.chips-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink-2);font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-fill);font-weight:600}
.rooms{display:grid;gap:20px}
.room-h{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.room-h h3{margin:0;font-size:15px;font-weight:600;color:var(--brand);min-width:0;overflow-wrap:anywhere}
.room-photo{flex:none;width:52px;height:52px;padding:0;border-radius:var(--r);border:1.5px dashed var(--line-2);background:var(--surface);color:var(--ink-3);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.room-photo.has{border:0}
.room-photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-big{display:block;width:100%;max-height:50vh;object-fit:cover;border-radius:var(--r-lg);margin-bottom:14px}

/* Plan du Nid */
.view-seg{flex:none;display:flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:2px}
.view-seg button{min-height:40px;min-width:64px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--ink-2);font-size:14px;cursor:pointer}
.view-seg button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);font-weight:600}
.plan{position:relative;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.plan .corr{position:absolute;background:var(--surface-2)}
.pr{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;margin:0;border:1.5px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);font-size:11.5px;line-height:1.15;text-align:center;cursor:pointer;overflow:hidden;overflow-wrap:normal;-webkit-hyphens:auto;hyphens:auto;transition:background .2s}
.pr b{font-weight:600}
.pr small{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pr.lit{background:var(--lit)}
.pr.lit small{color:var(--ink)}
.pr.none{color:var(--ink-2)}
.pr.pool{background:var(--pool);border-color:var(--pool);color:var(--pool-ink);border-radius:3px}
.pr.pool small{color:var(--pool-ink)}
.pr.out{background:transparent;border:1.5px dashed var(--line-2);color:var(--ink-2)}
.pr.out.lit{background:var(--lit);color:var(--ink)}
.pr.vt{writing-mode:vertical-rl}
.pr.zone{border:1px dashed var(--line-2)}
.pwall{position:absolute;z-index:2;border:1.5px solid var(--ink);pointer-events:none}
.miniplan .pwall{border-width:1px}
.pr.ramp{background:var(--surface-2);border:1.5px dashed var(--line-2);color:var(--ink-2);border-radius:3px}
.pr.ramp.lit{background:var(--lit);color:var(--ink)}
.pdeco{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);background:repeating-linear-gradient(90deg,var(--bg) 0 6px,var(--line-2) 6px 7px);font-size:11px;color:var(--ink-2);overflow:hidden;pointer-events:none}
.pdeco.vt{writing-mode:vertical-rl;background:repeating-linear-gradient(0deg,var(--bg) 0 6px,var(--line-2) 6px 7px)}
.pdeco span{background:var(--bg);padding:1px 5px}
.pr.bad::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.pr:active{filter:brightness(.95)}
.plan-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.plan-legend span{display:inline-flex;align-items:center;gap:6px}
.plan-legend i{width:14px;height:14px;border:1.5px solid var(--ink);background:var(--lit);display:inline-block}
.plan-legend i.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--bad)}
.plan-legend i.glass{width:18px;height:8px;background:var(--glass)}
.bay{position:absolute;z-index:3;padding:0;margin:0;border:1.5px solid var(--ink);border-radius:1px;background:var(--glass);cursor:pointer;overflow:visible}
.bay::before{content:"";position:absolute;inset:-9px}
.bay i{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--ink);opacity:.72;pointer-events:none}
.bay.bad{border-color:var(--bad);border-style:dashed}
.bay.fixe{cursor:default;pointer-events:none}
.bay.fixe::before{display:none}
.miniplan{display:block;width:100%;margin-top:12px;padding:0;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--bg);text-align:left;cursor:pointer;overflow:hidden}
.miniplan .plan{border:0;border-radius:0;pointer-events:none}
.miniplan .pr{border-width:1px}
.miniplan .bay{border-width:1px}
.miniplan .pdeco span{display:none}
/* Tableau de bord (iPad posé) */
.wall-go{display:none}
@media (min-width:900px){.wall-go{display:inline-flex}}
.sec-tools{display:flex;align-items:center;gap:8px}
body.wall .top,body.wall .tabs{display:none}
body.wall .wrap{max-width:none;padding-block:max(14px,env(safe-area-inset-top,0px)) 16px}
.wall-bar{display:flex;align-items:center;gap:24px;margin:0 0 14px}
.wall-clock{font-family:var(--serif);font-size:60px;font-weight:500;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wall-date{font-size:15px;color:var(--ink-3);margin-top:6px}
.wall-state{flex:1;min-width:0;font-size:16px;color:var(--ink-2)}
.wall-state b{display:block;color:var(--ink);font-size:20px;margin-bottom:2px}
.wall-plan{margin:0 auto;width:min(100%,calc((100vh - 170px) * 35 / 22.5))}
.mp-cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.mp-cap b{display:block;font-weight:600;font-size:15px}
.mp-cap small{display:block;color:var(--ink-2);font-size:13px}
.mp-go{flex:none;color:var(--brand);font-weight:600;font-size:14px}

/* Commandes */
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.seg{flex:none;display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{width:42px;height:40px;border:0;background:var(--bg);color:var(--brand);display:grid;place-items:center;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button:active{background:var(--surface-2)}
.stepper{flex:none;display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);color:var(--brand);font-size:20px;line-height:1;cursor:pointer}
.stepper b{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
.tag{flex:none;display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}

/* Boutons et formulaires */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg);color:var(--brand);font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn+.btn.block{margin-top:10px}
.mt{margin-top:14px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.checks legend{font-weight:600;font-size:14px}
.field input,.field textarea{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);color:var(--ink);width:100%}
.field textarea{min-height:110px;resize:vertical}
.field textarea.short{min-height:70px}
.field small{color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.checks{border:0;margin:0 0 14px;padding:0}
.checks legend{padding:0;margin-bottom:8px}
.checks .list label{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;cursor:pointer}
.checks .list label+label{border-top:1px solid var(--line)}
.checks input,.opt input,.o-name input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;cursor:pointer}
.opt input{margin:1px 0 0}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--ink-2);font-size:13px}
.form-msg{min-height:20px;margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.form-msg.ok{color:var(--ok)} .form-msg.bad{color:var(--bad)}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);color:var(--ink-2);font-size:14px;margin:0 0 14px}
.note.warn{background:var(--warn-bg);color:var(--ink)}
.note > span{flex:1 1 200px}
details.help{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:var(--bg)}
details.help summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--brand)}
details.help ol,details.help p{color:var(--ink-2);font-size:14px;margin:0 0 14px}
details.help ol{padding-left:20px;display:grid;gap:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* Partage */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;background:var(--bg);min-width:0}
.card .row{padding:0;min-height:0}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--brand);display:grid;place-items:center;font-weight:700}
.foot{margin:18px 0 0;color:var(--ink-3);font-size:13.5px;text-align:center}
.foot .linkbtn{min-height:40px}
.cols{display:grid;gap:0 28px}

/* Rangement par glisser-déposer */
.order{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;-webkit-user-select:none;user-select:none}
.order li{list-style:none;background:var(--bg)}
.order > li+li{border-top:1px solid var(--line)}
.o-row{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;min-height:56px}
.o-room{background:var(--surface)}
.o-room .o-name span{font-weight:600;color:var(--brand)}
.o-name{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;overflow-wrap:anywhere}
.handle{flex:none;width:48px;height:48px;border:0;border-radius:var(--r);background:none;color:var(--ink-3);display:grid;place-items:center;cursor:grab;touch-action:none;-webkit-touch-callout:none}
.dev-list{margin:0;padding:0;list-style:none}
.dev-list > li{border-top:1px solid var(--line)}
.dev-list .o-row{padding-left:34px;min-height:52px}
.dev-list:empty{border-top:1px dashed var(--line-2)}
.dev-list:empty::before{content:"Glisse un appareil ici";display:block;padding:14px 34px;color:var(--ink-3);font-size:14px}
.order li.off > .o-row .o-name span,.room-item.off .o-name span{color:var(--ink-3);font-weight:400}
.order li.dragging{position:relative;z-index:2;box-shadow:var(--lift);border-radius:var(--r)}
.order li.dragging > .o-row{background:var(--surface-2)}
.order li.dragging > .o-row .handle{color:var(--brand);cursor:grabbing}
.order.collapsed .dev-list{display:none}

/* Mode invité : très gros boutons */
.scenes.big{grid-template-columns:1fr;gap:14px}
.scenes.big .scene{flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;min-height:132px;padding:20px}
.scenes.big .scene-ic{width:72px;height:72px;flex:none}
.scenes.big .scene-ic .i{width:38px;height:38px}
.scenes.big .scene-name{font-size:24px}
.scenes.big .scene-ok{font-size:15px;top:12px;right:14px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-3);cursor:pointer;min-height:58px}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.tab[aria-current="page"] .i{stroke-width:2.2}

/* Feuille et message */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-card{position:relative;width:100%;max-width:560px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(22,24,27,.25)}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px}
.sheet-head h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;color:var(--ink)}
.sheet-head .icon-btn{margin-left:auto}
.sheet-body > .sec:first-child{margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);font-weight:500;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:var(--bg)}
.loading{padding:30px 0;text-align:center;color:var(--ink-3)}

/* iPad */
@media (min-width:700px){
  .scenes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scenes.big{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .share-top{max-width:520px}
  .sheet{align-items:center;padding:24px}
  .sheet-card{border-radius:14px;max-height:min(86vh,900px);padding-bottom:22px;box-shadow:var(--lift)}
}
@media (min-width:760px){
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (min-width:960px){
  .home{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:28px;align-items:start}
  .home-side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
  .home-main > .sec-row:first-child{margin-top:0}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}

/* ===== Le Nid, version douce : formes arrondies, cartes flottantes, laiton et Bodoni ===== */
:root{--r:16px;--r-lg:24px;--hair:rgba(168,135,79,.22);--plan-line:rgba(22,24,27,.5);
  --card-sh:0 1px 2px rgba(69,51,36,.05),0 10px 30px rgba(69,51,36,.08);
  --disc:linear-gradient(140deg,#e2c891 0%,#b8975c 52%,#7e6136 100%);--disc-ink:#16181b;
  --lit-grad:radial-gradient(120% 90% at 50% 35%,#fae3b6 0%,#f2c27c 100%);
  --pool-grad:linear-gradient(160deg,#86bbfb 0%,#4e8de4 100%);
  --page:radial-gradient(140% 60% at 50% 0%,#fbf9f5 0%,#f3eee6 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hair:rgba(210,174,109,.18);--plan-line:rgba(243,238,230,.42);
  --card-sh:0 1px 0 rgba(255,255,255,.04) inset,0 12px 34px rgba(0,0,0,.42);
  --lit-grad:radial-gradient(120% 90% at 50% 35%,#86602b 0%,#4b3519 100%);
  --pool-grad:linear-gradient(160deg,#3d7fd0 0%,#255da6 100%);
  --page:radial-gradient(140% 60% at 50% 0%,#1d1f25 0%,#111317 70%)}}
:root[data-theme="dark"]{--hair:rgba(210,174,109,.18);--plan-line:rgba(243,238,230,.42);
  --card-sh:0 1px 0 rgba(255,255,255,.04) inset,0 12px 34px rgba(0,0,0,.42);
  --lit-grad:radial-gradient(120% 90% at 50% 35%,#86602b 0%,#4b3519 100%);
  --pool-grad:linear-gradient(160deg,#3d7fd0 0%,#255da6 100%);
  --page:radial-gradient(140% 60% at 50% 0%,#1d1f25 0%,#111317 70%)}
body{background:var(--bg) var(--page) no-repeat fixed}
:focus-visible{outline-color:var(--accent)}
/* En-tête translucide */
.top{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px);border-bottom:1px solid var(--hair)}
.top-in{padding-block:12px}
.logo{border-radius:50%;background:var(--disc);color:var(--disc-ink);box-shadow:0 2px 8px rgba(126,97,54,.35)}
h1{font-size:28px;letter-spacing:.005em}
.icon-btn{border-radius:50%;border:1px solid var(--hair);background:var(--surface);box-shadow:var(--card-sh)}
/* Titres de rubrique : petites capitales laiton */
.sec{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin:30px 0 12px}
.sec-row{margin:30px 0 12px}
.linkbtn{color:var(--accent)}
/* Cartes */
.status{border-radius:var(--r-lg);padding:18px 18px 18px 16px;box-shadow:var(--card-sh)}
.status-dot{width:44px;height:44px;box-shadow:0 0 0 6px color-mix(in srgb,currentColor 0%,transparent)}
.status h2{font-size:23px}
.allclose,.miniplan,.list,.card,.order,.opt,details.help{border:1px solid var(--hair);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--card-sh)}
.allclose{min-height:72px;padding:12px 16px;margin-top:14px}
.allclose .row-ic,.scene-ic{background:var(--disc);color:var(--disc-ink);border-radius:50%;box-shadow:0 2px 6px rgba(126,97,54,.28)}
.row-ic{border-radius:50%;background:var(--surface-2)}
.row{padding:14px 16px}
.row+.row{border-top:1px solid var(--hair)}
.mp-cap{border-top:1px solid var(--hair);padding:12px 16px}
/* Scènes : tuiles douces, nom en Bodoni */
.scenes{gap:12px}
.scene{border:1px solid var(--hair);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--card-sh);min-height:122px;padding:16px}
.scene.now{border:1.5px solid var(--accent);padding:15.5px}
.scene-ic{width:46px;height:46px}
.scene-name{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.15}
.scene-now{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.scene.done{background:var(--fill);border-color:var(--fill)}
.ask{border:1px dashed var(--accent);border-radius:999px;color:var(--ink);min-height:56px}
/* Boutons en pastille */
.btn,.stepper button,.field input,.field textarea{border-radius:999px}
.field textarea{border-radius:var(--r)}
.btn{border-color:var(--hair);background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(69,51,36,.06)}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.seg{border-radius:999px;border-color:var(--hair);background:var(--surface)}
.seg button{background:transparent;color:var(--ink)}
.seg button+button{border-left-color:var(--hair)}
.view-seg{border-color:var(--hair);background:var(--surface)}
.chip{border-color:var(--hair);background:var(--surface)}
.note{border-radius:18px}
.tag{border-radius:999px}
/* Plan : traits fins, angles adoucis, lumière qui rayonne */
.plan{border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--card-sh);background:var(--surface)}
.miniplan .plan{box-shadow:none;border:0}
.pr{border:1px solid var(--plan-line);background:var(--surface);font-size:11.5px;letter-spacing:.01em}
.pr b{font-weight:600}
.pr.lit{background:var(--lit-grad)}
.pr.pool{background:var(--pool-grad);border-color:transparent;border-radius:16px}
.pr.out,.pr.ramp{border-radius:12px;border-color:var(--hair)}
.pr.zone{border-color:var(--hair)}
.pwall{border:1.5px solid var(--plan-line);border-radius:2px}
.bay{border:1px solid var(--plan-line);border-radius:4px}
.plan-legend i{border:1px solid var(--plan-line);border-radius:4px;background:var(--lit-grad)}
.pdeco{border-color:var(--hair)}
/* Barre d'onglets flottante */

/* ---------- Connexion Homey ---------- */
function normAddr(s){
  s=String(s||'').trim().replace(/\/+$/,'');
  if(!s) return '';
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(s)) return 'https://'+s.replace(/\./g,'-')+'.homey.homeylocal.com';
  if(/^[a-f0-9]{24}$/i.test(s)) return 'https://'+s.toLowerCase()+'.connect.athom.com';
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://'+s;
}
async function req(path,o){
  o=o||{};
  const b=o.base||base, k=o.key||(cfg&&cfg.key)||'';
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),o.timeout||9000);
  try{
    const h={'Authorization':'Bearer '+k};
    if(o.body!==undefined) h['Content-Type']='application/json';
    const r=await fetch(b+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined,signal:ctl.signal,cache:'no-store'});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    const tx=await r.text(); try{return tx?JSON.parse(tx):null}catch(_){return null}
  }finally{clearTimeout(t)}
}
async function tryConnect(c){
  let err=null;
  for(const [m,u,to] of [['local',c.local,4000],['remote',c.remote,9000]]){
    if(!u) continue;
    try{ await req('/api/manager/zones/zone/',{base:u,key:c.key,timeout:to}); return {ok:true,mode:m,base:u}; }
    catch(e){ err=e; }
  }
  return {ok:false,err};
}
function normFlows(m,type){
  if(!m) return [];
  return Object.values(m).filter(f=>f&&f.id&&f.enabled!==false)
    .map(f=>({id:f.id,name:f.name||'Sans nom',type,trig:f.triggerable!==false})).sort(byName);
}
async function loadLive(){

    req('/api/manager/flow/flow/').catch(()=>null), req('/api/manager/flow/advancedflow/').catch(()=>null),
    req('/api/manager/apps/app/').catch(()=>null)
  ]);
  const dd=d||{}; for(const k of Object.keys(dd)) if(isHidden(dd[k])) delete dd[k];
  data={zones:z||{},devices:dd,flows:normFlows(f,'flow').concat(normFlows(af,'advancedflow')),apps:ap};
}

function errMsg(e){
  const s=e&&e.status;

const isPh=(k,v)=>k==='measure_ph'||(/^measure_/.test(k)&&v&&/\bph\b/i.test(v.title||''));
const ALARM={alarm_smoke:'fumée détectée',alarm_co:'monoxyde de carbone détecté',alarm_co2:'CO₂ élevé',alarm_water:'fuite d’eau',alarm_fire:'incendie détecté',alarm_heat:'chaleur anormale',alarm_tamper:'sabotage détecté',alarm_generic:'alerte'};
function ctrlKind(d){
  const c=d.capabilitiesObj||{}, can=k=>c[k]&&c[k].setable!==false;
  if(can('windowcoverings_state')) return 'cover';
  if(can('windowcoverings_set')) return 'coverset';
  if(can('target_temperature')) return 'thermo';
  if(can('onoff')) return 'toggle';
  return 'read';
}
function devIcon(d){
  const cl=d.class||'';
  if(/thermostat|heater|airconditioning|fan/.test(cl)) return 'thermo';
  if(/piscine|pool/i.test(d.name)&&cl!=='light') return 'wave';
  if(cl==='homealarm'||/^base\b/i.test(d.name||'')) return 'shield';
  if(/dishwasher|oven|washer|dryer|cooktop|hob|fridge|kettle|coffeemachine/.test(cl)||/lave|plaque|cuisson|four\b|frigo|r[ée]frig|cong[ée]l|s[èe]che-linge|hotte/i.test(d.name||'')) return 'appliance';
  if(cl==='light') return 'bulb';
  if(cl==='socket') return 'plug';
  if(/windowcoverings|blinds|curtain|sunshade|garagedoor/.test(cl)) return 'blinds';
  if(/thermostat|heater|airconditioning|fan/.test(cl)) return 'thermo';
  if(/camera|doorbell/.test(cl)) return 'camera';
  if(cl==='lock') return 'lock';
  if(cl==='speaker') return 'speaker';
  if(cl==='sensor') return 'sensor';
  return 'dot';
}
function fmtMeasure(k,v){
  const x=v.value; if(typeof x!=='number') return '';
  if(isPh(k,v)) return 'pH '+nf1.format(x);
  const M={measure_temperature:()=>nf1.format(x)+' °C',measure_humidity:()=>nf0.format(x)+' %',measure_power:()=>nf0.format(x)+' W',measure_battery:()=>'Pile '+nf0.format(x)+' %',measure_luminance:()=>nf0.format(x)+' lx',measure_co2:()=>nf0.format(x)+' ppm'};
  if(M[k]) return M[k]();
  return ((v.title?v.title+' ':'')+nf1.format(x)+(v.units?' '+v.units:'')).trim();
}
function stateText(d){
  const c=d.capabilitiesObj||{}, parts=[];
  if(d.available===false) return d.unavailableMessage||'Ne répond plus';
  if(c.windowcoverings_set&&typeof c.windowcoverings_set.value==='number'){
    const p=Math.round(c.windowcoverings_set.value*100);
    parts.push(p>=99?'Ouvert':p<=1?'Fermé':'Ouvert à '+p+' %');
  }
  if(c.target_temperature&&typeof c.target_temperature.value==='number') parts.push('Consigne '+nf1.format(c.target_temperature.value)+' °C');
  for(const k of Object.keys(c)){
    if(parts.length>=3) break;
    const v=c[k]; if(!v) continue;
    if(/^measure_/.test(k)){ const t=fmtMeasure(k,v); if(t) parts.push(t); }
    else if(k==='alarm_contact') parts.push(v.value?'Ouverte':'Fermée');
    else if(k==='alarm_motion') parts.push(v.value?'Mouvement détecté':'Calme');
    else if(/^alarm_/.test(k)&&v.value===true) parts.push(ALARM[k]||'Alerte');
  }
  if(c.onoff){
    const lbl=c.onoff.title&&!/^(on\/off|allum|turned|aan|ein)/i.test(c.onoff.title)?c.onoff.title+' ':'';
    if(lbl) parts.push(lbl+(c.onoff.value?'en marche':'à l’arrêt'));
    else if(!parts.length) parts.push(d.class==='light'?(c.onoff.value?'Allumée':'Éteinte'):(c.onoff.value?'En marche':'À l’arrêt'));
  }
  return parts.join(' · ');
}
function watchItems(){
  const out=[];
  for(const d of Object.values(data.devices||{})){
    const c=d.capabilitiesObj||{};
    const nm=devName(d), rech=d.class==='curtain'||d.class==='blinds';
    if(d.available===false){ out.push({key:'off:'+d.id,kind:'off',dev:d,txt:nm+(rech?' ne répond plus : batterie à recharger ?':' ne répond plus')}); continue; }
    let batt=false;
    for(const [k,v] of Object.entries(c)){
      if(!v) continue; const x=v.value;
      if(ALARM[k]&&x===true) out.push({key:'al:'+d.id+':'+k,kind:'alarm',dev:d,txt:nm+' : '+ALARM[k]});
      if(!batt&&((k==='alarm_battery'&&x===true)||(k==='measure_battery'&&typeof x==='number'&&x<(rech?25:20)))){ batt=true; out.push({key:'bat:'+d.id,kind:'batt',dev:d,txt:rech?nm+' : batterie '+(typeof x==='number'?'à '+nf0.format(x)+' %':'faible')+', à recharger':nm+' : pile '+(typeof x==='number'?'à '+nf0.format(x)+' %':'faible')}); }
      if(isPh(k,v)&&typeof x==='number'&&(x<7.2||x>7.6)) out.push({key:'ph:'+d.id,kind:'ph',dev:d,txt:'pH de la piscine à '+nf1.format(x)+' (idéal entre 7,2 et 7,6)'});
    }
  }
  if(data.apps) for(const a of Object.values(data.apps)) if(appState(a)[0]==='bad') out.push({key:'app:'+a.id,kind:'app',txt:'Appli '+appName(a)+' en panne'});

}

function getLayout(){ const l=store.get('layout'+sfx(),null); return l&&Array.isArray(l.rooms)?l:null; }
function roomsView(){
  const out=[], byZone={}, placed=new Set();
  const ensure=z=>{ if(!byZone[z]){ byZone[z]={id:z,name:zoneName(z),off:false,devs:[]}; out.push(byZone[z]); } return byZone[z]; };
  const L=getLayout();
  if(L) for(const r of L.rooms){
    if(!r||typeof r.z!=='string') continue;
    const rv=ensure(r.z); rv.off=!!r.off;
    for(const x of (Array.isArray(r.d)?r.d:[])){ const d=x&&data.devices[x.i]; if(d&&!placed.has(d.id)){ rv.devs.push({dev:d,off:!!x.off}); placed.add(d.id); } }
  }
  const rest=Object.values(data.devices||{}).filter(d=>!placed.has(d.id)).sort((a,b)=>devName(a).localeCompare(devName(b),'fr'));
  [...new Set(rest.map(effZone))].filter(z=>!byZone[z]).map(z=>({id:z,name:zoneName(z)})).sort(byName).forEach(z=>ensure(z.id));
  rest.forEach(d=>ensure(effZone(d)).devs.push({dev:d,off:false}));
  return out.filter(r=>r.devs.length);
}

function loadPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const m=480, s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*s)); c.height=Math.max(1,Math.round(img.naturalHeight*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.72));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src=url;
  });
}

const coverMove={}; // id → {from,to,at,dur} (1 = ouvert, 0 = fermé)
function noteMove(d,to){
  const s=d.capabilitiesObj&&d.capabilitiesObj.windowcoverings_set, cur=s&&typeof s.value==='number'?s.value:(to?0:1);
  if(Math.abs(cur-to)<.02){ delete coverMove[d.id]; return; }
  coverMove[d.id]={from:cur,to,at:Date.now(),dur:d.class==='curtain'?20000:30000};
}
function moving(d){ const m=d&&coverMove[d.id]; if(!m) return null; if(Date.now()-m.at>m.dur){ delete coverMove[d.id]; return null; } return m; }
const moveClosed=m=>1-(m.from+(m.to-m.from)*Math.min(1,(Date.now()-m.at)/m.dur));
setInterval(()=>{
  const ids=Object.keys(coverMove); if(!ids.length) return;
  if(ids.some(id=>Date.now()-coverMove[id].at>coverMove[id].dur)){ ids.forEach(id=>{ if(Date.now()-coverMove[id].at>coverMove[id].dur) delete coverMove[id]; }); render(); return; }
  document.querySelectorAll('[data-mv]').forEach(el=>{ const m=coverMove[el.dataset.mv]; if(m) el.style[el.dataset.dir==='w'?'width':'height']=(Math.round(moveClosed(m)*1000)/10)+'%'; });
},400);
const LIT=new Map();
function litAnim(key,on){ const prev=LIT.get(key); LIT.set(key,!!on); return prev===undefined?'':(on&&!prev?' ignite':(!on&&prev?' dim':'')); }
async function setCap(id,cap,val){
  const d=data.devices[id]; if(!d) return;
  if(cap==='windowcoverings_state'||cap==='windowcoverings_set'){
    const to=cap==='windowcoverings_set'?(typeof val==='number'?val:null):(val==='up'?1:val==='down'?0:null);
    if(val==='idle') delete coverMove[id];
    else if(to!==null&&!(coverMove[id]&&Date.now()-coverMove[id].at<1500)) noteMove(d,to);
  }
  const c=d.capabilitiesObj&&d.capabilitiesObj[cap]; const old=c?c.value:undefined;
  if(mode==='demo'){ demoSet(d,cap,val); render(); return; }
  if(c) c.value=val; render();
  try{
    await req('/api/manager/devices/device/'+encodeURIComponent(id)+'/capability/'+encodeURIComponent(cap),{method:'PUT',body:{value:val}});
    setTimeout(refresh,1500);
    return true;
  }catch(e){
    if(c) c.value=old; render();
    const s=e&&e.status;
    toast(s===401||s===403?'Ta clé n’a pas le droit de piloter cet appareil.':'Commande non passée : Homey ne répond pas.','bad');
    return false;
  }
}
async function closeAll(btn){
  const list=coverDevices(); if(!list.length) return;
  btn.classList.add('busy');
  const cmd=d=>ctrlKind(d)==='cover'?['windowcoverings_state','down']:['windowcoverings_set',0];
  let fail=0;
  if(mode==='demo') list.forEach(d=>{ const [c,v]=cmd(d); demoSet(d,c,v); });
  else{
    const r=await Promise.allSettled(list.map(d=>{ const [c,v]=cmd(d); return req('/api/manager/devices/device/'+encodeURIComponent(d.id)+'/capability/'+c,{method:'PUT',body:{value:v}}); }));
    fail=r.filter(x=>x.status==='rejected').length;
    setTimeout(refresh,2500);
  }
  render();
  const n=list.length, ok=n-fail;
  if(!fail) toast(n>1?n+' volets et fenêtres se ferment':'Le volet se ferme');
  else if(!ok) toast('Aucun volet ne répond. Réessaie dans un instant.','bad');
  else toast(ok+' se ferment, '+fail+' ne répondent pas','bad');
}
async function trigger(f,g){
  const demo=g?g.a==='demo':mode==='demo';
  if(demo){ demoFx(f.id); return; }
  const t=f.type==='advancedflow'?'advancedflow':'flow';
  await req('/api/manager/flow/'+t+'/'+encodeURIComponent(f.id)+'/trigger',{method:'POST',body:{},base:g?g.a:base,key:g?g.k:cfg.key});
}
async function runScene(btn){
  if(preview){ toast('Aperçu : rien n’est lancé.'); return; }
  const f={id:btn.dataset.flow,type:btn.dataset.type,name:btn.dataset.name};
  const g=mode==='guest'?guest:null;

    render(); setTimeout(render,1900);

  }catch(e){
    btn.classList.remove('busy');

    if(s===401||s===403) m=g?'Ce bouton n’est plus autorisé. Demande un nouveau lien.':'Ta clé n’a pas le droit de lancer les scènes.';
    if(s===404) m='Cette scène n’existe plus dans Homey.';

function nowScene(list){

function roomState(o){

  const th=live.find(d=>d.capabilitiesObj&&d.capabilitiesObj.measure_temperature&&typeof d.capabilitiesObj.measure_temperature.value==='number'&&!/piscine|pool/i.test(d.name));
  let sub='';
  if(o.n==='Piscine'){ const p=live.find(d=>d.capabilitiesObj&&d.capabilitiesObj.measure_temperature&&typeof d.capabilitiesObj.measure_temperature.value==='number'); if(p) sub=nf1.format(p.capabilitiesObj.measure_temperature.value)+'°'; }

}

let wx=store.get('wx',null), wxBusy=false;
const WMO=c=>c===0?'Ensoleillé':c<=2?'Éclaircies':c===3?'Nuageux':c<=48?'Brouillard':c<=57?'Bruine':c<=67?'Pluie':c<=77?'Neige':c<=82?'Averses':'Orage';
async function wxLoad(force){
  const g=store.get('geo',null); if(!g||wxBusy) return;
  if(!force&&wx&&wx.lat===g.lat&&wx.lon===g.lon&&Date.now()-wx.at<30*60000) return;
  wxBusy=true;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=2&timezone=auto';
    const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('meteo');
    wx={at:Date.now(),lat:g.lat,lon:g.lon,j:await r.json()}; store.set('wx',wx); render();
  }catch(e){} finally{ wxBusy=false; }
}
function outTemp(){
  const d=Object.values(data.devices||{}).find(x=>x.available!==false&&/terrasse nord|ext[ée]rieur|dehors/i.test(x.name)&&x.capabilitiesObj&&x.capabilitiesObj.measure_temperature&&typeof x.capabilitiesObj.measure_temperature.value==='number');
  return d?d.capabilitiesObj.measure_temperature.value:null;
}
function wxHtml(){
  const g=store.get('geo',null), j=wx&&wx.j, t0=outTemp();
  const cur=t0!==null?t0:(j&&j.current&&typeof j.current.temperature_2m==='number'?j.current.temperature_2m:null);
  let line='';
  try{ if(j&&j.hourly&&j.daily){
    const H=new Date().getHours(), today=j.daily.time[0];
    if(H>=19&&j.daily.time.length>1) line='Demain : '+WMO(j.daily.weather_code[1]).toLowerCase()+', '+nf0.format(j.daily.temperature_2m_min[1])+'° → '+nf0.format(j.daily.temperature_2m_max[1])+'°';
    else{
      const idx=[]; j.hourly.time.forEach((t,i)=>{ if(t.slice(0,10)===today&&+t.slice(11,13)>=H) idx.push(i); });
      const temps=idx.map(i=>j.hourly.temperature_2m[i]); let trend='';
      if(temps.length){ const mx=Math.max(...temps), mn=Math.min(...temps), c=cur!==null?cur:temps[0];
        if(mx>c+1) trend='↗ '+nf0.format(mx)+'° vers '+(+j.hourly.time[idx[temps.indexOf(mx)]].slice(11,13))+' h';
        else if(mn<c-1) trend='↘ '+nf0.format(mn)+'° ce soir'; else trend='→ stable'; }
      const rain=idx.find(i=>(j.hourly.precipitation_probability[i]||0)>=50);
      line=WMO(j.daily.weather_code[0])+(trend?' · '+trend:'')+(rain!==undefined?' · pluie vers '+(+j.hourly.time[rain].slice(11,13))+' h':'');
    }
  } }catch(e){ line=''; }
  return '<b>'+(cur!==null?nf0.format(cur)+'°':'–')+'</b><small>'+esc(line||(g?'Dehors · prévisions en cours…':'Dehors'))+'</small>'
    +(!g?'<button class="linkbtn" type="button" id="wx-on">Afficher la tendance du jour</button>':'');
}

/* Glisser-déposer : pièces, appareils et scènes */
function enableDrag(root,scroller){
  let drag=null, lastY=0, raf=0;
  const items=p=>[...p.children].filter(x=>x!==drag.li);
  function place(y){
    if(drag.kind==='dev'){
      const rooms=[...root.children];
      let target=rooms[rooms.length-1];
      for(const r of rooms){ if(y<r.getBoundingClientRect().bottom){ target=r; break; } }
      const ul=target.querySelector('.dev-list'); let before=null;
      for(const it of items(ul)){ const b=it.getBoundingClientRect(); if(y<b.top+b.height/2){ before=it; break; } }
      if(drag.li.parentNode!==ul||drag.li.nextElementSibling!==before) ul.insertBefore(drag.li,before);
    } else {
      const par=drag.li.parentNode; let before=null;
      for(const it of items(par)){ const b=it.getBoundingClientRect(); if(y<b.top+b.height/2){ before=it; break; } }
      if(drag.li.nextElementSibling!==before) par.insertBefore(drag.li,before);
    }
  }
  function tick(){
    if(!drag) return;
    const r=scroller.getBoundingClientRect(); let dy=0;
    if(lastY<r.top+90) dy=-Math.ceil((r.top+90-lastY)/6);
    else if(lastY>r.bottom-70) dy=Math.ceil((lastY-(r.bottom-70))/6);
    if(dy){ const before=scroller.scrollTop; scroller.scrollTop+=dy; if(scroller.scrollTop!==before) place(lastY); }
    raf=requestAnimationFrame(tick);
  }
  root.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.handle'); if(!h) return;
    const li=h.closest('li');
    drag={li,id:e.pointerId,kind:li.classList.contains('dev-item')?'dev':li.classList.contains('room-item')?'room':'item'};
    lastY=e.clientY;
    if(drag.kind==='room'){
      const off=e.clientY-li.getBoundingClientRect().top;
      root.classList.add('collapsed');
      scroller.scrollTop+=li.getBoundingClientRect().top-(e.clientY-off);
    }
    li.classList.add('dragging');
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
    raf=requestAnimationFrame(tick);
  });
  root.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; lastY=e.clientY; place(lastY); });
  const end=()=>{
    if(!drag) return;
    const li=drag.li; li.classList.remove('dragging'); root.classList.remove('collapsed'); drag=null; cancelAnimationFrame(raf);
    const r=li.getBoundingClientRect(), s=scroller.getBoundingClientRect();
    if(r.top<s.top+60||r.top>s.bottom-60) scroller.scrollTop+=r.top-s.top-120;
  };
  root.addEventListener('pointerup',end);
  root.addEventListener('pointercancel',end);
  root.addEventListener('keydown',e=>{
    const h=e.target.closest('.handle'); if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown')) return;
    e.preventDefault();
    const li=h.closest('li'), par=li.parentNode, up=e.key==='ArrowUp', sib=up?li.previousElementSibling:li.nextElementSibling;
    if(sib) par.insertBefore(li,up?sib:sib.nextElementSibling);
    else if(li.classList.contains('dev-item')){
      const rl=par.closest('li'), other=rl&&(up?rl.previousElementSibling:rl.nextElementSibling);
      if(other){ const ul=other.querySelector('.dev-list'); ul.insertBefore(li,up?null:ul.firstElementChild); }
    }
    h.focus();
  });
  root.addEventListener('change',e=>{ const li=e.target.closest('li'); if(li) li.classList.toggle('off',!e.target.checked); });
}

let setupGot=false;
function readSetup(){
  const m=location.hash.match(/^#setup=([A-Za-z0-9_-]+)$/); if(!m) return;
  try{
    const p=JSON.parse(b64d(m[1]));
    if(typeof p.k!=='string'||!p.k||p.k.length>300||typeof p.l!=='string'||typeof p.r!=='string') throw new Error('bad');
    if(p.p&&typeof p.p==='object'&&!store.get('pins',null)) store.set('pins',cleanPins(p.p));
    if(cfg&&cfg.key===p.k) return;
    cfg={localRaw:p.l,remoteRaw:p.r,local:normAddr(p.l),remote:normAddr(p.r),key:p.k}; store.set('cfg',cfg);
    if(mode!=='guest'){ mode='live'; conn='loading'; base=''; }

  }catch(e){ setTimeout(()=>toast('Ce lien de branchement est illisible. Renvoie-le depuis l’iPhone.','bad'),300); }
}

  if(!ok){ setMsg('imp-msg','Réglages lus, mais Homey ne répond pas d’ici. Voir le message plus haut.','bad'); return; }
  if(Array.isArray(p.h)) store.set('home',p.h.filter(x=>typeof x==='string'));
  if(Array.isArray(p.s)) store.set('shares',p.s.filter(s=>s&&typeof s.id==='string'&&typeof s.n==='string'&&typeof s.k==='string'&&Array.isArray(s.b)&&s.b.every(x=>x&&typeof x.i==='string'&&typeof x.n==='string'&&(x.t==='flow'||x.t==='advancedflow'))));
  if(p.y&&Array.isArray(p.y.rooms)) store.set('layout',p.y);
  if(p.q&&typeof p.q==='object') store.set('pins',cleanPins(p.q));
  render(); toast('Réglages importés');
}
async function saveSettings(b){
  const localRaw=$('#cf-local').value.trim(), remoteRaw=$('#cf-remote').value.trim(), key=$('#cf-key').value.trim();
  const tmp={localRaw,remoteRaw,local:normAddr(localRaw),remote:normAddr(remoteRaw),key};
  if(!key){ setMsg('cf-msg','Colle d’abord ta clé API.','bad'); return false; }
  if(!tmp.local&&!tmp.remote){ setMsg('cf-msg','Remplis au moins une adresse.','bad'); return false; }
  b.disabled=true; setMsg('cf-msg','Test en cours…');
  const r=await tryConnect(tmp);
  b.disabled=false;
  if(!r.ok){ setMsg('cf-msg',errMsg(r.err),'bad'); return false; }
  cfg=tmp; store.set('cfg',cfg); mode='live'; base=r.base; conn=r.mode;
  try{ await loadLive(); }catch(e){}
  const nd=Object.keys(data.devices).length, ns=data.flows.filter(f=>f.trig).length;
  setMsg('cf-msg','Connecté : '+nd+' appareil'+(nd>1?'s':'')+', '+ns+' scène'+(ns>1?'s':'')+'.','ok');
  render(); setTimeout(closeSheet,1400);
  return true;
}
function openAsk(){
  const h='<div class="field"><label for="ask-text">Que doit faire la maison ?</label><textarea id="ask-text" placeholder="Ex. : quand je pars, fermer les volets et le Velux, éteindre la lumière de la piscine"></textarea></div>'
    +'<p class="form-msg" id="ask-msg" role="status"></p>'
    +'<button class="btn primary block" type="button" id="ask-copy">'+I('copy')+'Copier la demande pour Claude</button>'
    +'<div class="field mt"><textarea id="ask-out" readonly hidden aria-label="Demande à copier"></textarea></div>';
  openSheet('Nouveau scénario',h,{'ask-copy':async()=>{
    const wish=$('#ask-text').value.trim();
    if(!wish){ setMsg('ask-msg','Décris d’abord ce que tu veux.','bad'); return; }
    const devs=Object.values(data.devices).sort(byName).slice(0,80).map(d=>'- '+d.name+' ('+zoneName(d.zone)+')').join('\n');
    const fl=data.flows.map(f=>'- '+f.name).join('\n');
    const txt='Nouveau scénario pour ma maison (Homey Pro Early 2023)\n\nCe que je veux : '+wish+'\n\nMes appareils :\n'+(devs||'- (aucun)')+'\n\nMes scènes existantes :\n'+(fl||'- (aucune)')
      +'\n\nDonne-moi le Flow à créer dans Homey, carte par carte (Quand / Et / Alors), et dis-moi s’il manque un appareil ou une appli.';
    const ok=await copyText(txt,'ask-out');
    setMsg('ask-msg',ok?'Copié. Colle-le dans Claude, projet Domotique : tu recevras le Flow à créer.':'Sélectionne le texte ci-dessous et copie-le.','ok');
  }});
  setTimeout(()=>$('#ask-text')&&$('#ask-text').focus(),50);
}
function inviteLink(s){
  const addr=mode==='demo'?'demo':((cfg&&(cfg.remote||cfg.local))||'');
  return location.href.split('#')[0]+'#invite='+b64e(JSON.stringify({v:1,n:s.n,a:addr,k:s.k,g:s.g?1:0,b:s.b}));
}
function openShareForm(){
  const trig=data.flows.filter(f=>f.trig);
  let h='';
  if(mode==='live'&&cfg&&!cfg.remote) h+='<p class="note warn"><span>Sans adresse « En déplacement » dans Réglages, le lien ne marchera que sur le Wi-Fi de la maison.</span></p>';
  h+='<div class="field"><label for="sh-name">Prénom</label><input id="sh-name" maxlength="40" autocomplete="off" placeholder="Ex. : Marie"></div>'
    +'<div class="field"><label for="sh-key">Clé Homey de cette personne</label><input id="sh-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(mode==='demo'?'Pas besoin en démo':'Colle sa clé ici')+'">'
    +'<small>Sur my.homey.app : Réglages, Clés API. Crée une clé à son nom en cochant uniquement le droit de lancer les Flows.</small></div>';
  h+=trig.length?'<fieldset class="checks"><legend>Ses boutons</legend>'+flowChecks('sh-f-',[])+'</fieldset>':'<p class="muted">Aucune scène à partager pour l’instant.</p>';
  h+='<label class="opt" for="sh-big"><input type="checkbox" id="sh-big"><span><b>Très gros boutons</b><small>Un bouton par ligne, en grand. Pour une personne moins à l’aise avec le téléphone.</small></span></label>';
  h+='<p class="form-msg" id="sh-msg" role="status"></p><button class="btn primary block" type="button" id="sh-create">Créer le lien</button>'
    +'<div class="field mt"><textarea id="sh-out" readonly hidden aria-label="Lien à copier"></textarea></div>';
  openSheet('Partager des boutons',h,{'sh-create':async()=>{
    const n=$('#sh-name').value.trim(), k=$('#sh-key').value.trim()||(mode==='demo'?'demo':''), ids=checkedIds('sh-f-');
    if(!n){ setMsg('sh-msg','Indique un prénom.','bad'); return; }
    if(!k){ setMsg('sh-msg','Colle la clé de cette personne.','bad'); return; }
    if(!ids.length){ setMsg('sh-msg','Coche au moins un bouton.','bad'); return; }
    const s={id:'s'+Date.now(),n,k,g:$('#sh-big').checked?1:0,b:ids.map(id=>{const f=trig.find(x=>x.id===id);return {i:f.id,t:f.type,n:f.name};}),at:Date.now()};
    const all=getShares(); all.push(s); store.set('shares'+sfx(),all);
    const ok=await copyText(inviteLink(s),'sh-out');
    if(ok){ closeSheet(); render(); toast('Lien copié : envoie-le à '+n+' par message.'); }
    else { render(); setMsg('sh-msg','Lien créé. Sélectionne-le ci-dessous et copie-le.','ok'); }
  }});
}

/* ---------- Invitation ----------
   Le lien reste dans l'adresse : ajouté à l'écran d'accueil, il garde les boutons. */
function readInvite(){
  const m=location.hash.match(/^#invite=([A-Za-z0-9_-]+)$/);
  if(!m) return;
  try{
    const p=JSON.parse(b64d(m[1]));
    const okB=Array.isArray(p.b)&&p.b.length>0&&p.b.length<=24&&p.b.every(x=>x&&/^[\w-]{1,64}$/.test(x.i)&&(x.t==='flow'||x.t==='advancedflow')&&typeof x.n==='string'&&x.n.length<=80);
    if(typeof p.n!=='string'||p.n.length>40||typeof p.k!=='string'||p.k.length>300||!okB||!(p.a==='demo'||/^https:\/\/[^\s/]+$/.test(p.a))) throw new Error('bad');
    const g={n:p.n,a:p.a,k:p.k,g:p.g===1?1:0,b:p.b.map(x=>({i:x.i,t:x.t,n:x.n}))};
    if(!guest||JSON.stringify(guest)!==JSON.stringify(g)) store.del('guestBig');
    guest=g; store.set('guest',guest); mode='guest';
  }catch(e){ setTimeout(()=>toast('Ce lien de partage est illisible. Demande-en un nouveau.','bad'),300); }
}

/* ---------- Message ---------- */
let tt;
function toast(msg,kind){ const el=$('#toast'); el.textContent=msg; el.className='toast'+(kind?' '+kind:''); el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{el.hidden=true},2800); }

/* ---------- Événements ---------- */
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; store.set('tab',tab); render(); window.scrollTo(0,0); });
$('#gear').addEventListener('click',openSettings);
$('#theme-btn').addEventListener('click',()=>{ const t=store.get('theme','auto'), n=THEMES[(THEMES.indexOf(t)+1)%THEMES.length]; store.set('theme',n); applyTheme(); toast('Ambiance : '+TH_LABEL[n]); });
function devClick(b){
  const d=b.dataset.dev&&data.devices[b.dataset.dev]; if(!d) return false;
  if(b.hasAttribute('data-toggle')){ setCap(d.id,'onoff',!d.capabilitiesObj.onoff.value); return true; }
  if(b.dataset.cap){ setCap(d.id,b.dataset.cap,b.dataset.num!==undefined?Number(b.dataset.num):b.dataset.val); return true; }
  if(b.dataset.step){
    const c=d.capabilitiesObj.target_temperature; let v=(typeof c.value==='number'?c.value:20)+Number(b.dataset.step);
    v=Math.round(v*2)/2; if(typeof c.min==='number') v=Math.max(c.min,v); if(typeof c.max==='number') v=Math.min(c.max,v);
    setCap(d.id,'target_temperature',v); return true;
  }
  return false;
}
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.pin){ if(!pinEdit) pinTap(b.dataset.pin); return; }
  if(b.dataset.tree){ treeTap(+b.dataset.tree-1); return; }
  if(b.dataset.pcap){ poolTap(b.dataset.pcap); return; }
  if(b.dataset.go){ tab=b.dataset.go; store.set('tab',tab); pinEdit=false; render(); window.scrollTo(0,0); return; }
  if(b.dataset.flow){ runScene(b); return; }
  if(b.dataset.plan){ openRoom(b.dataset.plan); return; }
  if(b.dataset.bay){ toggleBay(b.dataset.bay); return; }
  if(b.dataset.rview){ store.set('roomsView',b.dataset.rview); render(); return; }
  if(b.dataset.room){ room=b.dataset.room; render(); return; }
  if(b.dataset.photo){ if(getPhoto(b.dataset.photo)) openPhoto(b.dataset.photo); else { photoZone=b.dataset.photo; $('#photo-input').click(); } return; }
  if(devClick(b)) return;
  switch(b.id){
    case 'allclose': closeAll(b); return;
    case 'night': openNight(); return;
    case 'go-plan': store.set('homePlan','big'); render(); window.scrollTo(0,0); return;
    case 'plan-small': store.set('homePlan','small'); pinEdit=false; render(); window.scrollTo(0,0); return;
    case 'watch': openWatch(); return;
    case 'pin-edit': pinEdit=!pinEdit; render(); toast(pinEdit?'Fais glisser chaque bouton où tu veux dans sa pièce, puis touche « Terminé ».':'Boutons rangés'); return;
    case 'pin-reset': if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Toucher encore pour confirmer'; return; } store.del('pins'+sfx()); render(); toast('Boutons remis à leur place'); return;
    case 'wx-on':
      if(!navigator.geolocation){ toast('Position indisponible sur cet appareil.','bad'); return; }
      navigator.geolocation.getCurrentPosition(pos=>{ store.set('geo',{lat:+pos.coords.latitude.toFixed(2),lon:+pos.coords.longitude.toFixed(2)}); wxLoad(true); toast('Météo du jour activée'); },()=>toast('Position refusée : pas de tendance météo.','bad'),{timeout:15000,maximumAge:86400000});
      return;
    case 'wall-go': store.set('wall',true); render(); window.scrollTo(0,0); return;
    case 'wall-exit': store.set('wall',false); render(); return;
    case 'ask': openAsk(); return;
    case 'arrange': openArrange(); return;
    case 'arrange-rooms': openArrangeRooms(); return;
    case 'open-settings': openSettings(); return;
    case 'retry': conn='loading'; render(); refresh(); return;
    case 'share-new': openShareForm(); return;
    case 'preview-close': preview=null; render(); return;
    case 'guest-size': store.set('guestBig',!guestBig(guest,false)); render(); return;
    case 'guest-quit':
      if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Toucher encore pour confirmer'; return; }
      try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(_){}
      guest=null; store.del('guest'); store.del('guestBig'); mode=cfg&&cfg.key?'live':'demo'; conn=mode==='demo'?'demo':'loading'; if(mode==='demo') data=makeDemo(); render(); if(mode==='live') refresh(); return;
  }
  const sid=b.dataset.copyShare||b.dataset.preview||b.dataset.remove;
  const s=sid&&getShares().find(x=>x.id===sid);
  if(!s) return;
  if(b.dataset.copyShare){ copyText(inviteLink(s)).then(ok=>toast(ok?'Lien copié : envoie-le à '+s.n+' par message.':'Copie impossible ici. Utilise « Aperçu » pour vérifier.',ok?'':'bad')); return; }
  if(b.dataset.preview){ preview=s; render(); window.scrollTo(0,0); return; }
  if(b.dataset.remove){
    if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Confirmer'; return; }
    store.set('shares'+sfx(),getShares().filter(x=>x.id!==sid)); render();
    toast(mode==='demo'?'Retiré de la liste.':'Retiré. Supprime aussi sa clé dans Homey.');
  }
});
// Déplacer les boutons sur le plan (mode « Déplacer les boutons »)
$('#view').addEventListener('pointerdown',e=>{
  if(!pinEdit) return; const b=e.target.closest('.pin'); if(!b) return;
  const o=PLAN.find(x=>x.n===b.dataset.room), plan=b.closest('.plan'), tall=plan.classList.contains('tall');
  // cadre de la pièce, en fractions du plan à l'écran
  const box=!o?null:tall?{x0:(PLAN_H-o.y-o.h)/PLAN_H,x1:(PLAN_H-o.y)/PLAN_H,y0:(PLAN_W-o.x-o.w)/PLAN_W,y1:(PLAN_W-o.x)/PLAN_W}
    :{x0:o.x/PLAN_W,x1:(o.x+o.w)/PLAN_W,y0:(PLAN_H-o.y-o.h)/PLAN_H,y1:(PLAN_H-o.y)/PLAN_H};
  pinDrag={b,plan,o,box,id:b.dataset.pin,pid:e.pointerId,moved:false};
  try{ b.setPointerCapture(e.pointerId); }catch(_){}
  b.classList.add('drag'); e.preventDefault();
});
$('#view').addEventListener('pointermove',e=>{
  const g=pinDrag; if(!g||e.pointerId!==g.pid) return;
  const r=g.plan.getBoundingClientRect();
  g.lx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); g.ly=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  if(g.box){ const mx=14/r.width, my=14/r.height, B=g.box;
    g.lx=Math.max(B.x0+Math.min(mx,(B.x1-B.x0)/2),Math.min(B.x1-Math.min(mx,(B.x1-B.x0)/2),g.lx));
    g.ly=Math.max(B.y0+Math.min(my,(B.y1-B.y0)/2),Math.min(B.y1-Math.min(my,(B.y1-B.y0)/2),g.ly)); }
  g.b.style.left=(g.lx*100)+'%'; g.b.style.top=(g.ly*100)+'%'; g.moved=true;
});
function pinEnd(){
  const g=pinDrag; if(!g) return; pinDrag=null; g.b.classList.remove('drag');
  if(g.moved){
    const tall=g.plan.classList.contains('tall'), X=tall?PLAN_W*(1-g.ly):PLAN_W*g.lx, Y=tall?PLAN_H*(1-g.lx):PLAN_H*(1-g.ly);
    let here=null; for(const o of PLAN) if(X>=o.x&&X<=o.x+o.w&&Y>=o.y&&Y<=o.y+o.h) here=o;
    const room=g.o, d=data.devices[g.id];
    if(room&&here===room){
      const m=store.get('pins'+sfx(),{})||{}; m[g.id]={r:room.n,fx:+((X-room.x)/room.w).toFixed(3),fy:+((Y-room.y)/room.h).toFixed(3)}; store.set('pins'+sfx(),m);
      toast((d?devName(d):'Bouton')+' : bien placé');
    } else toast((d?devName(d):'Ce bouton')+' reste dans '+(room?(room.t||room.s||room.n):'sa pièce')+'.','bad');
  }
  render();
}
$('#view').addEventListener('pointerup',pinEnd);
$('#view').addEventListener('pointercancel',pinEnd);
$('#photo-input').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0], z=photoZone; e.target.value=''; photoZone=null;
  if(!f||!z) return;
  try{
    const url=await loadPhoto(f);
    if(!store.setRaw(photoKey(z),url)){ toast('Plus de place pour les photos sur cet appareil.','bad'); return; }
    if(!$('#sheet').hidden) closeSheet();
    render(); toast('Photo ajoutée');
  }catch(err){ toast('Cette image ne s’ouvre pas. Essaie une autre photo.','bad'); }
});
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ closeSheet(); return; }
  const ig=e.target.closest('button[data-ign]'); if(ig){ const m=store.get('ign'+sfx(),{})||{}; m[ig.dataset.ign]=Date.now()+7*864e5; store.set('ign'+sfx(),m); render(); toast('Masqué pour 7 jours'); return; }
  if(e.target.closest('[data-ign-reset]')){ store.del('ign'+sfx()); render(); return; }
  const pc=e.target.closest('button[data-pcap]'); if(pc){ poolTap(pc.dataset.pcap); return; }
  const ps=e.target.closest('button[data-pspeed]'); if(ps){ poolSpeed(ps.dataset.pspeed); return; }
  const ph=e.target.closest('button[data-phyd]'); if(ph){ poolHyd(ph.dataset.phyd); return; }
  const db=e.target.closest('button[data-dev]'); if(db&&devClick(db)) return;
  const b=e.target.closest('button[id]'); if(b&&sheetActions[b.id]) sheetActions[b.id](b);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&mode==='live') refresh(); });
setInterval(()=>{
  if(document.hidden||!$('#sheet').hidden||(tab!=='home'&&tab!=='rooms')) return;
  if(mode==='live'&&conn!=='off'&&conn!=='loading') refresh();
  else if(mode==='demo'&&tab==='home') render();
},15000);

try{ window.matchMedia('(max-width: 699px)').addEventListener('change',()=>{ if(tab==='rooms') render(); }); }catch(_){}
try{ window.matchMedia('(min-width: 900px)').addEventListener('change',()=>{ if(tab==='rooms') render(); }); }catch(_){}
setInterval(()=>{ const c=$('#wall-clock'); if(!c) return; const tm=wallTime(); c.textContent=tm.t; const d=$('#wall-date'); if(d) d.textContent=tm.d; },10000);

/* ---------- Démarrage ---------- */
readInvite();
readSetup();
if(setupGot) setTimeout(()=>toast('Réglages reçus de ton iPhone : connexion à Homey…'),400);
if(mode==='demo'){ data=makeDemo(); conn='demo'; }
render();
if(mode==='live') refresh();
wxLoad();
setInterval(()=>wxLoad(),10*60000);
if(SETUP&&mode==='demo') setTimeout(openSettings,400);
})();
</script>
